# ---------------------------------------------------------------------------
# Serveur
# ---------------------------------------------------------------------------
server.port=8082

# ---------------------------------------------------------------------------
# Base de donnees H2 en memoire (etape 2 du TP)
# ---------------------------------------------------------------------------
spring.datasource.url=jdbc:h2:mem:banque;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Console web H2 : http://localhost:8082/h2-console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=false

# ---------------------------------------------------------------------------
# JPA / Hibernate
# ---------------------------------------------------------------------------
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false
spring.jpa.defer-datasource-initialization=true

# ---------------------------------------------------------------------------
# Serialisation JSON : dates au format ISO court, identique en lecture
# et en ecriture (evite les decalages de fuseau horaire)
# ---------------------------------------------------------------------------
spring.jackson.date-format=yyyy-MM-dd
spring.jackson.time-zone=UTC
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.default-property-inclusion=non_null

# ---------------------------------------------------------------------------
# Jersey (JAX-RS)
# ---------------------------------------------------------------------------
# Jersey prend en charge les requetes a la racine : Spring MVC n'expose plus
# que la console H2. Le ResourceConfig est declare dans config/JerseyConfig.
spring.jersey.application-path=/
spring.jersey.type=servlet

# ---------------------------------------------------------------------------
# Journalisation
# ---------------------------------------------------------------------------
logging.level.root=INFO
logging.level.com.ahmedbenidar.banque=INFO
logging.level.org.glassfish.jersey=INFO
